[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "django-workshop-monitoring"
version = "0.1.0rc1"
description = "Monitoring app for the advanced Django workshop"
readme = "README-package.md"
requires-python = ">=3.14"
dependencies = [
    "Django>=5.2,<5.3",
    "djangorestframework>=3.17,<3.18",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.3,<4"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["monitoring", "monitoring.*"]
namespaces = false

[tool.setuptools.package-data]
monitoring = ["sql/*.sql"]
